services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hacksite}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-hacksite}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hacksite} -d ${POSTGRES_DB:-hacksite}"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "127.0.0.1:5433:5432"


  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-hacksite}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-hacksite}
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env}
      ADMIN_PASSPHRASE: ${ADMIN_PASSPHRASE:?set ADMIN_PASSPHRASE in .env}
      PORT: 3000
    expose:
      - "3000"
    networks:
      default:
      proxy:
        aliases:
          - hacksite

volumes:
  db-data:

networks:
  proxy:
    external: true
